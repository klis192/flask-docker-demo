name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Linter
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t my-flask-app .
